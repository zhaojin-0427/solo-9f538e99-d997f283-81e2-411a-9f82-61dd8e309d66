name: pm25-pipeline

services:
  source:
    build: ./source
    image: pm25-mock-source
    environment:
      PAGE_SIZE: "8"            # 每页条数
      STATION_COUNT: "20"       # 首版全量站点数
      SEED: "20261118"          # 确定性数据种子
      FAULT_SLEEP_SECONDS: "10" # timeout 故障的挂起时长(须大于采集端超时)
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12

  collector:
    build: ./collector
    image: pm25-collector
    environment:
      SOURCE_BASE_URL: http://source:8000
      DB_PATH: /data/collector.db
      PAGE_TIMEOUT_SECONDS: "3"
      MAX_ATTEMPTS: "3"
      RETRY_BACKOFF_SECONDS: "0.5"
    volumes:
      - collector-data:/data
    ports:
      - "8000:8000"
    depends_on:
      source:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  collector-data:
